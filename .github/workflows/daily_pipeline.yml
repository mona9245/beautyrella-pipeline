name: Daily Meta Ads Pipeline
on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      backfill_mode:
        description: "백필 모드 (true/false)"
        required: false
        default: "false"
      backfill_start:
        description: "백필 시작일 (YYYY-MM-DD)"
        required: false
        default: "2026-02-23"
      backfill_end:
        description: "백필 종료일 (YYYY-MM-DD)"
        required: false
        default: "2026-05-31"
jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 패키지 설치
        run: pip install requests google-cloud-bigquery
      - name: GCP 인증
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}"
      - name: 파이프라인 실행
        env:
          META_ACCESS_TOKEN: "${{ secrets.META_ACCESS_TOKEN }}"
          META_AD_ACCOUNT_ID: "${{ secrets.META_AD_ACCOUNT_ID }}"
          BACKFILL_MODE: "${{ github.event.inputs.backfill_mode || 'false' }}"
          BACKFILL_START: "${{ github.event.inputs.backfill_start }}"
          BACKFILL_END: "${{ github.event.inputs.backfill_end }}"
        run: python fetch_meta_ads.py
